<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Code Drift</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Inter', sans-serif; 
            user-select: none;
            -webkit-user-select: none;
        }
        #game-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
        }
        .ui-layer { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
            z-index: 10; 
        }
        .pointer-events-auto { pointer-events: auto; }
        
        .glass-panel { 
            background: rgba(20, 20, 25, 0.7); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
        }

        .progress-bar-bg { background: rgba(0,0,0,0.5); border-radius: 999px; overflow: hidden; height: 8px; width: 100%; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); width: 0%; transition: width 0.2s; }

        .nitrous-bar-fill { height: 100%; background: linear-gradient(90deg, #06b6d4, #3b82f6); width: 100%; transition: width 0.1s; }
        
        .odometer { 
            font-family: 'Courier New', Courier, monospace; 
            letter-spacing: 2px; 
            background: #0a0a0a; 
            color: #fff; 
            padding: 2px 6px; 
            border-radius: 4px; 
            border: 1px inset #333; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        #speedometer {
            font-variant-numeric: tabular-nums;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast {
            animation: slideIn 0.3s forwards;
        }
        .toast.hiding {
            animation: fadeOut 0.3s forwards;
        }

        /* Control Toggle Visibility */
        .controls-desktop #mobile-controls { display: none !important; }
        .controls-mobile #mobile-controls { display: flex !important; }
        
        .touch-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; color: white; user-select: none;
            touch-action: none; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .touch-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
    </style>
</head>
<body>
    <!-- Boot Screen -->
    <div id="boot-screen" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-black transition-opacity duration-700">
        <h1 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-600 tracking-[0.2em] mb-12 drop-shadow-[0_0_25px_rgba(59,130,246,0.8)] uppercase italic" style="font-family: 'Arial Black', sans-serif;">CODE DRIFT</h1>
        <button id="btn-ride" class="px-16 py-4 text-2xl font-black text-white bg-blue-600/20 border-2 border-blue-500 rounded-full hover:bg-blue-500/50 hover:scale-105 hover:shadow-[0_0_40px_rgba(59,130,246,0.8)] transition-all uppercase tracking-widest backdrop-blur-md">RIDE</button>
        
        <!-- Creator Credits -->
        <div class="absolute bottom-8 flex flex-col items-center gap-2">
            <span class="text-xs md:text-sm font-bold text-gray-500 uppercase tracking-widest">Game Creator Ryan</span>
            <span class="text-sm md:text-base font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 via-green-400 via-blue-500 to-purple-500 animate-pulse">Powered by Gemini</span>
        </div>
    </div>

    <!-- Settings Button -->
    <button id="btn-settings" class="fixed top-4 left-4 z-40 touch-btn w-12 h-12 bg-gray-900/60 border-gray-500 text-2xl hidden md:flex items-center justify-center">⚙️</button>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/70 backdrop-blur-md">
        <div class="glass-panel p-6 md:p-8 rounded-2xl w-[90%] max-w-md flex flex-col gap-6 text-white shadow-[0_0_50px_rgba(0,0,0,0.8)] border-t border-white/20">
            <h2 class="text-3xl font-black border-b border-white/10 pb-3">GAME SETTINGS</h2>
            
            <!-- Volume -->
            <div>
                <label class="block text-sm font-bold text-gray-400 uppercase mb-2">Master Volume</label>
                <input type="range" id="setting-volume" min="0" max="100" value="100" class="w-full accent-blue-500 cursor-pointer">
            </div>
            
            <!-- Graphics -->
            <div>
                <label class="block text-sm font-bold text-gray-400 uppercase mb-2">Graphics Quality</label>
                <select id="setting-graphics" class="w-full bg-black/60 border border-white/20 rounded-lg p-3 text-white outline-none font-bold cursor-pointer">
                    <option value="low">Low (Fast Performance)</option>
                    <option value="med">Medium (Balanced)</option>
                    <option value="cinematic" selected>Cinematic (High Quality)</option>
                </select>
            </div>
            
            <!-- Handling -->
            <div>
                <label class="block text-sm font-bold text-gray-400 uppercase mb-2">Steering Sensitivity</label>
                <input type="range" id="setting-handling" min="50" max="200" value="100" class="w-full accent-emerald-500 cursor-pointer">
            </div>

            <!-- Fullscreen Toggle -->
            <div>
                <label class="block text-sm font-bold text-gray-400 uppercase mb-2">Display</label>
                <button id="btn-fullscreen" class="w-full bg-black/60 border border-white/20 rounded-lg p-3 text-white outline-none font-bold cursor-pointer hover:bg-white/10 transition-colors uppercase tracking-wider">Toggle Full Screen</button>
            </div>
            
            <button id="btn-close-settings" class="mt-4 py-4 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl font-black text-lg hover:from-blue-500 hover:to-purple-500 transition-all uppercase tracking-wider shadow-lg">Apply & Close</button>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="game-canvas"></div>

    <!-- HUD (Heads Up Display) -->
    <div id="hud" class="ui-layer flex flex-col justify-between p-4 md:p-6 transition-opacity duration-300">
        
        <!-- Top Stats -->
        <div class="flex justify-between items-start">
            <!-- Level & XP -->
            <div class="glass-panel p-4 rounded-xl w-48 md:w-64 flex flex-col gap-2 pointer-events-none">
                <div class="flex justify-between items-end">
                    <span class="text-gray-400 text-xs font-bold uppercase tracking-wider">Level</span>
                    <span id="level-display" class="text-2xl font-black text-white drop-shadow-md">1</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="xp-bar" class="progress-bar-fill"></div>
                </div>
                <div class="text-right text-[10px] text-gray-400 font-mono"><span id="xp-display">0</span> / <span id="xp-needed">100</span> XP</div>
            </div>

            <!-- Currency, Speed, & Controls (Stacked on Right) -->
            <div class="flex flex-col items-end gap-3 pointer-events-auto w-48">
                <div class="glass-panel px-5 py-2 rounded-full flex items-center gap-2 pointer-events-none">
                    <span class="text-emerald-400 font-black text-xl drop-shadow-[0_0_8px_rgba(52,211,113,0.8)]" id="currency-display">0</span>
                    <span class="text-lg">💎</span>
                </div>
                
                <div class="glass-panel p-4 rounded-xl text-center w-full flex flex-col gap-1 pointer-events-none">
                    <div id="speedometer" class="text-5xl font-black text-white italic drop-shadow-[0_0_10px_rgba(255,255,255,0.4)]">000</div>
                    <div class="text-gray-400 text-[10px] font-bold uppercase tracking-widest mt-1 mb-2">KM/H</div>
                    
                    <!-- Nitrous Bar -->
                    <div class="w-full bg-gray-900 rounded-full h-2 border border-gray-700">
                        <div id="nitrous-bar" class="nitrous-bar-fill"></div>
                    </div>
                    <div class="text-[9px] text-cyan-400 uppercase font-black text-left mb-1 tracking-widest">N2O BOOST</div>
                    
                    <!-- Odometer -->
                    <div id="odometer" class="odometer text-xs mt-1 text-right">000000.0</div>
                </div>

                <!-- Toggle Controls (Moved under Odometer) -->
                <button id="btn-toggle-controls" class="glass-panel px-4 py-2 mt-1 rounded-lg font-bold text-white bg-blue-600/30 border border-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:bg-blue-500/50 transition-colors flex items-center justify-center gap-2 w-full text-sm">
                    <span id="control-icon">📱</span> <span id="control-text">Mobile Mode</span>
                </button>
                
                <!-- Fast Travel (Moved under Odometer) -->
                <select id="teleport-select" class="glass-panel px-3 py-2 rounded-lg font-bold text-white bg-transparent outline-none cursor-pointer border border-white/20 shadow-xl w-full text-sm">
                    <option value="" disabled selected>Fast Travel...</option>
                    <option value="dealership" class="text-black">🏢 Dealership</option>
                    <option value="park" class="text-black">🌲 Central Park</option>
                    <option value="track" class="text-black">🏁 Race Track</option>
                    <option value="drag" class="text-black">🚦 Drag Strip</option>
                </select>
            </div>
        </div>

        <!-- Controls Hint (Bottom Left) -->
        <div class="flex justify-between items-end pointer-events-auto mt-auto">
            <div id="desktop-hints" class="glass-panel px-4 py-3 rounded-lg text-xs md:text-sm text-gray-300 flex flex-col gap-1 hidden md:flex">
                <div><span class="font-bold text-white bg-white/20 px-1.5 rounded">W A S D</span> or <span class="font-bold text-white bg-white/20 px-1.5 rounded">Arrows</span> to Move/Drive</div>
                <div><span class="font-bold text-white bg-white/20 px-1.5 rounded">F</span> to Enter/Exit/Buy Vehicle</div>
                <div><span class="font-bold text-white bg-white/20 px-1.5 rounded">Shift</span> to Nitrous Boost</div>
                <div><span class="font-bold text-white bg-white/20 px-1.5 rounded">Space</span> to Brake / Drift</div>
                <div><span class="font-bold text-white bg-white/20 px-1.5 rounded">C</span> to Toggle Camera</div>
                <div><span class="font-bold text-white bg-white/20 px-1.5 rounded">Right Click</span> to Free Look</div>
            </div>
        </div>
    </div>

    <!-- Center Screen Interaction Prompt -->
    <div id="action-prompt" class="absolute top-2/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass-panel px-6 py-3 rounded-full text-white font-black text-lg tracking-wider hidden z-20 pointer-events-none transition-all duration-200">
        Press F (or 🟡) to Interact
    </div>

    <div id="mobile-controls" class="ui-layer flex justify-between items-end p-4 md:p-8 z-20 pointer-events-none hidden">
        <!-- Left: Steering & Boost (N2O Moved Here to Prevent Overlap) -->
        <div class="flex flex-col gap-4 pointer-events-auto mb-2 items-start">
            <button id="btn-boost" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 text-cyan-300 bg-cyan-600/40 border-cyan-400 text-sm font-black shadow-[0_0_15px_rgba(6,182,212,0.5)]">N2O</button>
            <div class="flex gap-2">
                <button id="btn-left" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 bg-black/40 text-2xl font-black">◀</button>
                <button id="btn-right" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 bg-black/40 text-2xl font-black">▶</button>
            </div>
        </div>
        <!-- Right: Pedals & Actions aligned in absolute grid to prevent overlap -->
        <div class="relative w-[200px] h-[200px] pointer-events-auto">
            <div class="absolute bottom-0 right-0 flex flex-col gap-2">
                <button id="btn-gas" class="touch-btn w-16 h-14 sm:w-20 sm:h-16 bg-emerald-500/40 border-emerald-400 rounded-2xl text-2xl font-black">▲</button>
                <button id="btn-reverse" class="touch-btn w-16 h-14 sm:w-20 sm:h-16 bg-emerald-700/40 border-emerald-600 rounded-2xl text-2xl font-black">▼</button>
            </div>
            <button id="btn-brake" class="touch-btn absolute bottom-0 right-20 sm:right-24 w-16 h-16 sm:w-20 sm:h-20 bg-red-500/40 border-red-400 text-xl font-bold">B</button>
            <button id="btn-interact" class="touch-btn absolute top-0 right-20 sm:right-24 w-16 h-16 sm:w-20 sm:h-20 text-yellow-300 bg-yellow-600/60 border-yellow-400 font-bold text-xl">F</button>
            <button id="btn-cam" class="touch-btn absolute top-0 right-0 w-16 h-16 sm:w-20 sm:h-20 bg-blue-500/40 border-blue-400 text-xl">🎥</button>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-24 right-4 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <script>
        const state = {
            gameState: 'BOOT', // Start at boot screen
            playerMode: 'ON_FOOT', // ON_FOOT, DRIVING
            cameraMode: 'THIRD_PERSON', // THIRD_PERSON, FIRST_PERSON
            level: 1,
            xp: 0,
            currency: 8500, 
            speed: 0,
            maxSpeed: 0.8,
            handling: 0.03,
            acceleration: 0.005,
            nitrous: 100,
            distance: 0,
            settings: { volume: 1.0, graphics: 'cinematic', handlingMult: 1.0 }, // Added Settings State
            activeCarIndex: 0,
            currentInteractable: null,
            controls: window.innerWidth < 1024 ? 'mobile' : 'desktop', // Auto-detect initially
            cars: [
                { name: "Urban Cruiser", price: 0, owned: true, color: 0xe74c3c, type: 'sedan' },
                { name: "Retro Classic", price: 1500, owned: false, color: 0xf1c40f, type: 'sedan' },
                { name: "Apex Phantom", price: 2500, owned: false, color: 0x3498db, type: 'sport' },
                { name: "Titan SUV", price: 6000, owned: false, color: 0x2ecc71, type: 'suv' },
                { name: "Night Rider", price: 8000, owned: false, color: 0x111111, type: 'bike' },
                { name: "Street Brawler", price: 12000, owned: false, color: 0x9b59b6, type: 'bike' },
                { name: "Hyperion X", price: 25000, owned: false, color: 0xff3300, type: 'sport' }
            ],
            inputs: { forward: false, backward: false, left: false, right: false, brake: false, boost: false }
        };

        const config = {
            citySize: 40, // 40x40 grid
            blockSize: 50,
            roadWidth: 14,
        };

        let collisionBoxes = [];
        let worldCars = []; 
        let activeWorldCar = null; 
        let playerMesh = null; 
        let playerLimbs = {}; // Holds references to animate legs/arms
        let carVelocity = 0;
        let carAngle = 0;
        let walkCycle = 0; // Animation timer for walking

        const container = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xff7b54); 
        scene.fog = new THREE.FogExp2(0xff7b54, 0.005); 

        // Set clipping plane very near for First Person viewing
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 1000);
        
        const hemiLight = new THREE.HemisphereLight(0x666688, 0x111122, 0.9); // Brighter ambient
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfff0dd, 2.5); // Cinematic sunset color
        sunLight.position.set(-100, 100, -50); 
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; // High res shadows
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 300;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight); 

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800 border-l-4 border-blue-500';
            if(type === 'success') bgClass = 'bg-gray-800 border-l-4 border-emerald-500';
            if(type === 'error') bgClass = 'bg-red-900 border-l-4 border-red-500';
            if(type === 'levelup') bgClass = 'bg-gradient-to-r from-purple-600 to-blue-600 border border-white/20 shadow-[0_0_15px_rgba(139,92,246,0.5)] text-lg py-4';

            toast.className = `toast ${bgClass} text-white px-6 py-3 rounded shadow-xl flex items-center gap-3 font-bold`;
            toast.innerHTML = type === 'levelup' ? `🎉 ${message}` : message;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateHUD() {
            document.getElementById('level-display').innerText = state.level;
            document.getElementById('currency-display').innerText = Math.floor(state.currency);
            
            const xpNeeded = state.level * 200;
            document.getElementById('xp-display').innerText = Math.floor(state.xp);
            document.getElementById('xp-needed').innerText = xpNeeded;
            document.getElementById('xp-bar').style.width = `${Math.min(100, (state.xp / xpNeeded) * 100)}%`;

            const displaySpeed = Math.floor(Math.abs(carVelocity) * 200).toString().padStart(3, '0');
            document.getElementById('speedometer').innerText = displaySpeed;
            document.getElementById('nitrous-bar').style.width = `${Math.max(0, state.nitrous)}%`;
            document.getElementById('odometer').innerText = state.distance.toFixed(1).padStart(8, '0');
        }

        function addExperience(amount) {
            state.xp += amount;
            const xpNeeded = state.level * 200;
            if (state.xp >= xpNeeded) {
                state.xp -= xpNeeded;
                state.level++;
                showToast(`LEVEL UP! You are now Level ${state.level}`, 'levelup');
            }
        }

        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a1a24'; ctx.fillRect(0, 0, 256, 512);
            const darkWindow = '#0a0a0f';
            for (let x = 16; x < 256; x += 32) {
                for (let y = 16; y < 512; y += 48) {
                    ctx.fillStyle = Math.random() > 0.4 ? darkWindow : '#ffaa55';
                    ctx.fillRect(x, y, 16, 32);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createCityGroundTexture() {
            // Generates a massive, perfect city grid with roads, lanes, and sidewalks
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // Base dark asphalt
            ctx.fillStyle = '#1e1e24'; 
            ctx.fillRect(0, 0, 1024, 1024);
            
            // The block size in our world is 50. Road width is 14.
            // Ratio: road is 28% (14% per side). Sidewalk/Block is 72%.
            // 14% of 1024 = 143px road margin. Block sits in the middle.
            const margin = 143;
            const blockDim = 1024 - (margin * 2);

            // Sidewalk/Foundation
            ctx.fillStyle = '#444450';
            ctx.fillRect(margin, margin, blockDim, blockDim);
            
            // Inner dirt/grass patch for variety under buildings
            ctx.fillStyle = '#2a2a30';
            ctx.fillRect(margin + 20, margin + 20, blockDim - 40, blockDim - 40);

            // Road Lines (Dashed white lines in center of roads)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.setLineDash([40, 40]);
            
            // Top/Bottom lines
            ctx.beginPath(); ctx.moveTo(0, margin/2); ctx.lineTo(1024, margin/2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 1024 - margin/2); ctx.lineTo(1024, 1024 - margin/2); ctx.stroke();
            // Left/Right lines
            ctx.beginPath(); ctx.moveTo(margin/2, 0); ctx.lineTo(margin/2, 1024); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(1024 - margin/2, 0); ctx.lineTo(1024 - margin/2, 1024); ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(config.citySize, config.citySize);
            return texture;
        }

        function createTree() {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({color: 0x3d2817, roughness: 1.0});
            const leavesMat = new THREE.MeshStandardMaterial({color: 0x2d4c1e, roughness: 0.9});
            
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3, 5), trunkMat);
            trunk.position.y = 1.5;
            group.add(trunk);
            
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(3.5, 6, 7), leavesMat);
            leaves.position.y = 5;
            group.add(leaves);
            
            group.castShadow = true;
            return group;
        }
        
        function buildCity() {
            // Using the new universal city grid ground
            const groundMat = new THREE.MeshStandardMaterial({ map: createCityGroundTexture(), roughness: 0.9, metalness: 0.1 });
            const bldgMat = new THREE.MeshStandardMaterial({ map: createBuildingTexture(), roughness: 0.5, metalness: 0.2 });
            const parkGroundMat = new THREE.MeshStandardMaterial({ color: 0x2a3b22, roughness: 1 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.4, roughness: 0.1, metalness: 0.8 });

            // One massive plane for perfect unbroken roads
            const groundSize = config.citySize * config.blockSize;
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(groundSize, groundSize), groundMat);
            ground.rotation.x = -Math.PI / 2; ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);

            const offset = (config.citySize * config.blockSize) / 2;
            const bldgGroup = new THREE.Group();

            for (let x = 0; x < config.citySize; x++) {
                for (let z = 0; z < config.citySize; z++) {
                    // posX/posZ represent the CENTER of the city block
                    const posX = x * config.blockSize - offset + config.blockSize/2;
                    const posZ = z * config.blockSize - offset + config.blockSize/2;
                    
                    const isDealership = Math.abs(x - 20) <= 1 && Math.abs(z - 20) <= 1;
                    const isPark = (x < 12 && z < 12); 
                    const isTrack = (x > 28 && z < 15); 
                    const isDrag = (x < 15 && z > 25); 

                    if (isDealership) {
                        if (x === 20 && z === 20) {
                            const floor = new THREE.Mesh(new THREE.BoxGeometry(90, 0.5, 90), new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.1, metalness: 0.8}));
                            floor.position.set(posX, 0.25, posZ);
                            scene.add(floor);

                            // Steel Pillars
                            for (let px of [-45, 45]) {
                                for (let pz of [-45, 45]) {
                                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 15, 16), new THREE.MeshStandardMaterial({color: 0x444444, metalness: 0.9, roughness: 0.2}));
                                    pillar.position.set(posX + px, 7.5, posZ + pz);
                                    scene.add(pillar);
                                }
                            }

                            // Glass Walls (Left, Right, Back - leaving front open to drive out)
                            const gMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.2, roughness: 0.1, metalness: 0.9 });
                            
                            const wLeft = new THREE.Mesh(new THREE.BoxGeometry(2, 15, 90), gMat);
                            wLeft.position.set(posX - 45, 7.5, posZ);
                            scene.add(wLeft);
                            
                            const wRight = new THREE.Mesh(new THREE.BoxGeometry(2, 15, 90), gMat);
                            wRight.position.set(posX + 45, 7.5, posZ);
                            scene.add(wRight);
                            
                            const wBack = new THREE.Mesh(new THREE.BoxGeometry(90, 15, 2), gMat);
                            wBack.position.set(posX, 7.5, posZ - 45);
                            scene.add(wBack);
                            
                            // Glowing Roof Trim
                            const dRoof = new THREE.Mesh(new THREE.BoxGeometry(94, 2, 94), new THREE.MeshStandardMaterial({color: 0x1a1a24}));
                            dRoof.position.set(posX, 15.5, posZ);
                            scene.add(dRoof);

                            const trimMat = new THREE.MeshBasicMaterial({color: 0x00ffff});
                            const dTrim = new THREE.Mesh(new THREE.BoxGeometry(94.5, 0.5, 94.5), trimMat);
                            dTrim.position.set(posX, 15.5, posZ);
                            scene.add(dTrim);

                            // Collision bounds for walls only
                            collisionBoxes.push({ minX: posX - 46, maxX: posX - 44, minZ: posZ - 46, maxZ: posZ + 46 });
                            collisionBoxes.push({ minX: posX + 44, maxX: posX + 46, minZ: posZ - 46, maxZ: posZ + 46 });
                            collisionBoxes.push({ minX: posX - 46, maxX: posX + 46, minZ: posZ - 46, maxZ: posZ - 44 });
                        }
                        continue;
                    }

                    if (isPark) {
                        if (Math.random() > 0.4) {
                            const tree = createTree();
                            tree.position.set(posX + (Math.random() * 20 - 10), 0, posZ + (Math.random() * 20 - 10));
                            bldgGroup.add(tree);
                            collisionBoxes.push({ minX: tree.position.x - 1, maxX: tree.position.x + 1, minZ: tree.position.z - 1, maxZ: tree.position.z + 1 });
                        }
                        const pGround = new THREE.Mesh(new THREE.PlaneGeometry(config.blockSize - config.roadWidth, config.blockSize - config.roadWidth), parkGroundMat);
                        pGround.rotation.x = -Math.PI / 2; pGround.position.set(posX, 0.05, posZ);
                        scene.add(pGround);
                        continue; 
                    }

                    if (!isTrack && !isDrag) {
                        const bWidth = config.blockSize - config.roadWidth - 4; // Leave room for sidewalk
                        const dist = Math.sqrt(posX*posX + posZ*posZ);
                        const nDist = 1 - Math.min(dist / offset, 1);
                        const bHeight = 20 + Math.random() * (100 * Math.pow(nDist, 2));

                        const building = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), bldgMat);
                        building.scale.set(bWidth, bHeight, bWidth);
                        building.position.set(posX, bHeight / 2, posZ);
                        building.castShadow = true; building.receiveShadow = true;
                        bldgGroup.add(building);

                        collisionBoxes.push({
                            minX: posX - bWidth/2, maxX: posX + bWidth/2,
                            minZ: posZ - bWidth/2, maxZ: posZ + bWidth/2
                        });
                    }
                }
            }
            scene.add(bldgGroup);
        }

        function createPlayerCharacter() {
            const group = new THREE.Group();
            
            // Materials
            const skinMat = new THREE.MeshStandardMaterial({color: 0xffccaa, roughness: 0.8});
            const shirtMat = new THREE.MeshStandardMaterial({color: 0x3b82f6, roughness: 0.9}); // Blue shirt
            const pantsMat = new THREE.MeshStandardMaterial({color: 0x1f2937, roughness: 0.9}); // Dark jeans
            
            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
            head.position.y = 1.7; 
            head.castShadow = true;
            group.add(head);
            
            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.25), shirtMat);
            torso.position.y = 1.2; 
            torso.castShadow = true;
            group.add(torso);
            
            // Arms
            const armGeo = new THREE.BoxGeometry(0.18, 0.6, 0.18);
            armGeo.translate(0, -0.2, 0); // Move pivot to shoulder
            
            const lArm = new THREE.Mesh(armGeo, skinMat);
            lArm.position.set(0.35, 1.4, 0); lArm.castShadow = true;
            group.add(lArm);
            
            const rArm = new THREE.Mesh(armGeo, skinMat);
            rArm.position.set(-0.35, 1.4, 0); rArm.castShadow = true;
            group.add(rArm);
            
            // Legs
            const legGeo = new THREE.BoxGeometry(0.22, 0.7, 0.22);
            legGeo.translate(0, -0.35, 0); // Move pivot to hip
            
            const lLeg = new THREE.Mesh(legGeo, pantsMat);
            lLeg.position.set(0.14, 0.9, 0); lLeg.castShadow = true;
            group.add(lLeg);
            
            const rLeg = new THREE.Mesh(legGeo, pantsMat);
            rLeg.position.set(-0.14, 0.9, 0); rLeg.castShadow = true;
            group.add(rLeg);

            return { mesh: group, limbs: { lArm, rArm, lLeg, rLeg } };
        }

        function createCarGeometry(type, colorHex) {
            const group = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.7 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.8 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
            const interiorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

            const wheels = []; // Track wheels for animation

            // BIKE GENERATION
            if (type === 'bike') {
                // Frame
                const frameGeo = new THREE.BoxGeometry(0.5, 0.7, 2.2);
                const frame = new THREE.Mesh(frameGeo, bodyMat);
                frame.position.y = 0.6; frame.castShadow = true;
                group.add(frame);
                
                // Gas Tank / Seat
                const tank = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 1.2), new THREE.MeshStandardMaterial({color: 0x111}));
                tank.position.set(0, 1.05, -0.2);
                group.add(tank);

                // Handlebars (Steering mechanism)
                const handleGroup = new THREE.Group();
                const bars = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2), interiorMat);
                bars.rotation.z = Math.PI/2;
                handleGroup.add(bars);
                
                // Headlight
                const hl = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.2), new THREE.MeshBasicMaterial({color: 0xffffff}));
                hl.position.set(0, -0.1, 0.2);
                handleGroup.add(hl);
                
                handleGroup.position.set(0, 1.1, 0.8);
                group.add(handleGroup);
                group.userData.steeringWheel = handleGroup;

                // Wheels
                const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16);
                wheelGeo.rotateZ(Math.PI / 2);
                const w1 = new THREE.Mesh(wheelGeo, wheelMat);
                w1.position.set(0, 0.35, 1.1);
                const w2 = new THREE.Mesh(wheelGeo, wheelMat);
                w2.position.set(0, 0.35, -1.1);
                group.add(w1, w2);
                wheels.push(w1, w2);

            } else {
                // CAR GENERATION
                let bodyWidth = 1.8;
                let bodyLength = 4.2;
                let bodyHeight = 0.8;
                let cabinHeight = 0.6;
                
                if (type === 'suv') { bodyWidth = 2.0; bodyLength = 4.6; bodyHeight = 1.1; cabinHeight = 0.7; }
                if (type === 'sport') { bodyWidth = 1.9; bodyLength = 4.0; bodyHeight = 0.6; cabinHeight = 0.5; }

                // Chassis
                const chassis = new THREE.Mesh(new THREE.BoxGeometry(bodyWidth, bodyHeight, bodyLength), bodyMat);
                chassis.position.y = 0.5 + bodyHeight/2;
                chassis.castShadow = true;
                group.add(chassis);

                // Cabin
                const cabinGeo = new THREE.BoxGeometry(bodyWidth - 0.2, cabinHeight, bodyLength - 1.5);
                const cabin = new THREE.Mesh(cabinGeo, glassMat);
                cabin.position.y = chassis.position.y + bodyHeight/2 + cabinHeight/2;
                cabin.position.z = -0.2;
                group.add(cabin);

                // Interior & Dashboard
                const dash = new THREE.Mesh(new THREE.BoxGeometry(bodyWidth - 0.3, 0.3, 0.4), interiorMat);
                dash.position.set(0, cabin.position.y - cabinHeight/2 + 0.15, cabin.position.z + (bodyLength - 1.5)/2 - 0.2);
                group.add(dash);

                const steeringWheel = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 8, 16), interiorMat);
                steeringWheel.position.set(0.4, dash.position.y + 0.1, dash.position.z - 0.1);
                steeringWheel.rotation.x = Math.PI / 6;
                group.add(steeringWheel);
                group.userData.steeringWheel = steeringWheel;

                // Headlights
                const hlMat = new THREE.MeshBasicMaterial({color: 0xffffee});
                const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), hlMat);
                hl1.position.set(bodyWidth/2 - 0.3, chassis.position.y + 0.1, bodyLength/2 + 0.05);
                const hl2 = hl1.clone(); hl2.position.x = -hl1.position.x;
                group.add(hl1, hl2);

                // Taillights
                const tlMat = new THREE.MeshBasicMaterial({color: 0xff0000});
                const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), tlMat);
                tl1.position.set(bodyWidth/2 - 0.3, chassis.position.y + 0.1, -bodyLength/2 - 0.05);
                const tl2 = tl1.clone(); tl2.position.x = -tl1.position.x;
                group.add(tl1, tl2);

                // Wheels
                const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16);
                wheelGeo.rotateZ(Math.PI / 2);
                const wPos = [
                    [bodyWidth/2 + 0.1, 0.35, bodyLength/2 - 0.8], [-bodyWidth/2 - 0.1, 0.35, bodyLength/2 - 0.8],
                    [bodyWidth/2 + 0.1, 0.35, -bodyLength/2 + 0.8], [-bodyWidth/2 - 0.1, 0.35, -bodyLength/2 + 0.8]
                ];
                wPos.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                    wheel.position.set(pos[0], pos[1], pos[2]);
                    group.add(wheel);
                    wheels.push(wheel);
                });
            }

            group.userData.wheels = wheels;
            return group;
        }

        function setupWorld() {
            // Create proper human character
            const character = createPlayerCharacter();
            playerMesh = character.mesh;
            playerLimbs = character.limbs;

            // Spawn inside dealership
            const offset = (config.citySize * config.blockSize) / 2;
            const spawnX = 20 * config.blockSize - offset + config.blockSize/2;
            const spawnZ = 20 * config.blockSize - offset + config.blockSize/2;
            playerMesh.position.set(spawnX, 0, spawnZ + 15);
            scene.add(playerMesh);

            // Place Cars physically in the Dealership
            state.cars.forEach((carDef, i) => {
                const carMesh = createCarGeometry(carDef.type, carDef.color);
                
                // Position in a showroom circle (expanded radius for more cars)
                const angle = (i / state.cars.length) * Math.PI * 2;
                const radius = 30;
                const cX = spawnX + Math.cos(angle) * radius;
                const cZ = spawnZ + Math.sin(angle) * radius;
                
                carMesh.position.set(cX, 0.5, cZ);
                carMesh.rotation.y = -angle + Math.PI/2;
                
                const plat = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.2, 32), new THREE.MeshStandardMaterial({ color: 0x333344 }));
                plat.position.set(cX, 0.3, cZ);
                scene.add(plat);
                
                scene.add(carMesh);
                
                worldCars.push({
                    mesh: carMesh,
                    data: carDef,
                    index: i
                });
            });
        }

        function handleInteract() {
            if (state.playerMode === 'ON_FOOT') {
                if (state.currentInteractable) {
                    const carData = state.currentInteractable.data;
                    if (carData.owned) {
                        // Enter the car
                        state.playerMode = 'DRIVING';
                        activeWorldCar = state.currentInteractable;
                        carVelocity = 0;
                        carAngle = activeWorldCar.mesh.rotation.y;
                        playerMesh.visible = false; // Hide player model while driving
                        
                        // Restrict 1st person to bikes only
                        if (state.cameraMode === 'FIRST_PERSON' && carData.type !== 'bike') {
                            state.cameraMode = 'THIRD_PERSON';
                            camera.fov = 60;
                            camera.updateProjectionMatrix();
                            showToast("1st Person is for bikes only. Switched to 3rd Person.", "info");
                        } else {
                            showToast(`Started driving ${carData.name}`, 'success');
                        }
                    } else {
                        // Buy the car
                        if (state.currency >= carData.price) {
                            state.currency -= carData.price;
                            carData.owned = true;
                            updateHUD();
                            showToast(`Purchased ${carData.name}!`, 'success');
                            document.getElementById('action-prompt').innerText = `Press F (or 🟡) to Drive ${carData.name}`;
                        } else {
                            showToast(`Not enough gems! Need ${carData.price}💎`, 'error');
                        }
                    }
                }
            } else if (state.playerMode === 'DRIVING') {
                // Exit the car
                state.playerMode = 'ON_FOOT';
                
                // Spawn player safely to the left side of the vehicle
                playerMesh.position.copy(activeWorldCar.mesh.position);
                const ejectOffset = new THREE.Vector3(-1.5, 0, 0);
                ejectOffset.applyEuler(activeWorldCar.mesh.rotation);
                playerMesh.position.add(ejectOffset);
                playerMesh.position.y = 1.0; 
                
                playerMesh.visible = true; // Show player again
                activeWorldCar = null;
                showToast(`Exited vehicle`, 'info');
            }
        }

        function toggleCamera() {
            if (state.playerMode === 'DRIVING' && activeWorldCar && activeWorldCar.data.type !== 'bike' && state.cameraMode === 'THIRD_PERSON') {
                showToast("1st Person view is only available on bikes!", "error");
                return;
            }

            state.cameraMode = state.cameraMode === 'THIRD_PERSON' ? 'FIRST_PERSON' : 'THIRD_PERSON';
            showToast(`Camera: ${state.cameraMode.replace('_', ' ')}`, 'info');
            
            // Reset FOV immediately to avoid transition weirdness
            camera.fov = state.cameraMode === 'FIRST_PERSON' ? 75 : 60;
            camera.updateProjectionMatrix();
        }

        updateControlsUI();

        // --- NEW: BOOT SCREEN & SETTINGS LOGIC ---

        document.getElementById('btn-close-settings').addEventListener('click', () => {
            document.getElementById('settings-modal').style.display = 'none';
            
            // Apply Settings
            const vol = parseInt(document.getElementById('setting-volume').value);
            state.settings.volume = vol / 100;
            if (audioReady) {
                // Convert 0-1 linear to Decibels (Tone.js uses DB)

            }

        // -----------------------------------------

        document.getElementById('teleport-select').addEventListener('change', (e) => {
            const loc = e.target.value;
            const offset = (config.citySize * config.blockSize) / 2;
            let targetX = 0, targetZ = 0;

            if (loc === 'dealership') { targetX = 20 * 50 - offset + 25; targetZ = 20 * 50 - offset + 25; }
            if (loc === 'park') { targetX = 6 * 50 - offset + 25; targetZ = 6 * 50 - offset + 25; }
            if (loc === 'track') { targetX = 34 * 50 - offset + 25; targetZ = 8 * 50 - offset + 25; }
            if (loc === 'drag') { targetX = 8 * 50 - offset + 25; targetZ = 32 * 50 - offset + 25; }

            e.target.value = ""; // reset dropdown
        });

        // --- AUDIO SYSTEM (Procedural Synthesis) ---
        let audioInitialized = false;
        let audioReady = false;
        let engineNoise, engineSub, engineFilter, engineVolume, footstepNoise, windNoise, windFilter, windVolume;

        async function initAudio() {
            if (audioInitialized) return;
            audioInitialized = true; // Set immediately to prevent double-calls
            await Tone.start();
            
            Tone.Destination.volume.value = 0; // Default Tone DB limit
            
            // Engine Synth (Layered for depth & realism)
            engineSub = new Tone.Oscillator({ type: "sine", frequency: 50 }).start();
            engineNoise = new Tone.Oscillator({ type: "sawtooth", frequency: 50 }).start();
            
            // Add distortion to mimic exhaust rumbling
            const dist = new Tone.Distortion(0.4);
            engineFilter = new Tone.Filter(200, "lowpass");
            engineVolume = new Tone.Volume(-Infinity).toDestination(); // Explicit Volume node
            
            engineSub.connect(dist);
            engineNoise.connect(dist);
            dist.connect(engineFilter);
            engineFilter.connect(engineVolume);

            // Wind & Tire Skid Synth (Filtered white noise)
            windNoise = new Tone.Noise("white").start();
            windFilter = new Tone.Filter(400, "lowpass");
            windVolume = new Tone.Volume(-Infinity).toDestination(); // Explicit Volume node
            
            windNoise.connect(windFilter);
            windFilter.connect(windVolume);

            // Footsteps (Brown noise, quick decay)
            footstepNoise = new Tone.NoiseSynth({
                noise: { type: 'brown' },
                envelope: { attack: 0.01, decay: 0.08, sustain: 0, release: 0.01 }
            }).toDestination();
            footstepNoise.volume.value = 5; // Louder footsteps

            audioReady = true; // Flag that objects are fully created and safe to use
        }

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (state.gameState !== 'PLAYING') return;
            switch(e.code) {
                case 'ArrowUp': case 'KeyW': state.inputs.forward = true; break;
                case 'ArrowDown': case 'KeyS': state.inputs.backward = true; break;
                case 'ArrowLeft': case 'KeyA': state.inputs.left = true; break;
                case 'ArrowRight': case 'KeyD': state.inputs.right = true; break;
                case 'Space': state.inputs.brake = true; break;
                case 'ShiftLeft': case 'ShiftRight': state.inputs.boost = true; break;
                case 'KeyC': toggleCamera(); break;
                case 'KeyF': handleInteract(); break;
            }
        });
        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'ArrowUp': case 'KeyW': state.inputs.forward = false; break;
                case 'ArrowDown': case 'KeyS': state.inputs.backward = false; break;
                case 'ArrowLeft': case 'KeyA': state.inputs.left = false; break;
                case 'ArrowRight': case 'KeyD': state.inputs.right = false; break;
                case 'Space': state.inputs.brake = false; break;
                case 'ShiftLeft': case 'ShiftRight': state.inputs.boost = false; break;
            }
        });

        // Robust Touch Listeners (Fixes sticking inputs)
        function setupTouchControl(id, inputKey, isToggle = false) {
            const btn = document.getElementById(id);
            if(!btn) return;
            
            const startEvent = (e) => { 
                e.preventDefault(); 
                if(!isToggle) state.inputs[inputKey] = true; 
                else if (id === 'btn-cam') toggleCamera(); 
                else if (id === 'btn-interact') handleInteract(); 
            };
            
            const endEvent = (e) => { 
                e.preventDefault(); 
                if(!isToggle) state.inputs[inputKey] = false; 
            };

            // Modern pointer events handle both mouse and touch flawlessly without getting stuck
            btn.addEventListener('pointerdown', startEvent);
            btn.addEventListener('pointerup', endEvent);
            btn.addEventListener('pointercancel', endEvent);
            btn.addEventListener('pointerout', endEvent);
            
            // Prevent double-firing and unwanted scrolling
            btn.addEventListener('touchstart', (e) => e.preventDefault(), {passive: false});
        }
        setupTouchControl('btn-gas', 'forward'); setupTouchControl('btn-brake', 'brake');
        setupTouchControl('btn-reverse', 'backward');
        setupTouchControl('btn-left', 'left'); setupTouchControl('btn-right', 'right');
        setupTouchControl('btn-boost', 'boost'); setupTouchControl('btn-cam', 'none', true);
        setupTouchControl('btn-interact', 'none', true);

        let orbitAngleX = 0;
        let orbitAngleY = 0;
        let isDraggingCam = false;
        let previousPointer = {x: 0, y: 0};

        container.addEventListener('contextmenu', e => e.preventDefault());

        const startDrag = (x, y, isValid) => {
            initAudio();
            if (isValid) { isDraggingCam = true; previousPointer = {x, y}; }
        };
        const moveDrag = (x, y) => {
            if (isDraggingCam) {
                const deltaX = x - previousPointer.x;
                const deltaY = y - previousPointer.y;
                orbitAngleX -= deltaX * 0.005; // Perfect 360 degree freedom (Removed clamp/speed limit)
                orbitAngleY += deltaY * 0.005; 
                orbitAngleY = Math.max(-Math.PI/6, Math.min(Math.PI/3, orbitAngleY));
                previousPointer = {x, y};
            }
        };
        const endDrag = () => { isDraggingCam = false; };

        // PC Mouse Free Cam (Right Click or Left Click on canvas)
        container.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY, e.button === 2 || e.button === 0));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endDrag);

        // Touch Free Cam (Dragging anywhere on canvas that isn't a UI button)
        container.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'CANVAS') startDrag(e.touches[0].clientX, e.touches[0].clientY, true);
        }, {passive: false});
        container.addEventListener('touchmove', (e) => {
            if (isDraggingCam && e.target.tagName === 'CANVAS') {
                e.preventDefault();
                moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});
        container.addEventListener('touchend', endDrag);

        function checkCollision(nx, nz, radius = 1.0) {
            const bound = (config.citySize * config.blockSize) / 2;
            if (nx - radius < -bound || nx + radius > bound || nz - radius < -bound || nz + radius > bound) {
                return true; // Hit the edge of the map
            }

            for (let i = 0; i < collisionBoxes.length; i++) {
                const box = collisionBoxes[i];
                const closestX = Math.max(box.minX, Math.min(nx, box.maxX));
                const closestZ = Math.max(box.minZ, Math.min(nz, box.maxZ));
                const dx = nx - closestX; const dz = nz - closestZ;
                if ((dx * dx + dz * dz) < (radius * radius)) return true;
            }
            return false;
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 16.66, 3); // Normalize to 60fps, cap delta to prevent massive jumps
            lastTime = now;

            if (state.gameState === 'PLAYING') {
                
                // === ON FOOT LOGIC ===
                if (state.playerMode === 'ON_FOOT') {
                    const playerSpeed = 0.25;
                    let moveX = 0, moveZ = 0;
                    
                    if (state.inputs.forward) moveZ -= 1;
                    if (state.inputs.backward) moveZ += 1;
                    if (state.inputs.left) moveX -= 1;
                    if (state.inputs.right) moveX += 1;

                    // Camera relative movement
                    if (moveX !== 0 || moveZ !== 0) {
                        const camDir = new THREE.Vector3();
                        camera.getWorldDirection(camDir);
                        camDir.y = 0;
                        camDir.normalize();
                        
                        const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
                        
                        const moveVec = new THREE.Vector3();
                        moveVec.addScaledVector(camDir, -moveZ);
                        moveVec.addScaledVector(camRight, moveX);
                        moveVec.normalize();
                        
                        const nextX = playerMesh.position.x + moveVec.x * playerSpeed * dt;
                        const nextZ = playerMesh.position.z + moveVec.z * playerSpeed * dt;
                        
                        if (!checkCollision(nextX, nextZ, 0.4)) {
                            playerMesh.position.x = nextX;
                            playerMesh.position.z = nextZ;
                        }
                        
                        // Rotate player smoothly to face EXACT movement direction (shortest path fix)
                        const targetRotation = Math.atan2(moveVec.x, moveVec.z);
                        let diff = targetRotation - playerMesh.rotation.y;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        playerMesh.rotation.y += diff * 0.1 * dt; // Smoother fluid rotation

                        // Walking Animation & Footstep Audio logic
                        let lastWalkCycle = walkCycle;
                        walkCycle += 0.15 * dt;
                        
                        if (audioReady) {
                            // Play footstep sound exactly when foot hits the ground (pi/2 interval)
                            if (Math.floor(lastWalkCycle / (Math.PI/2)) !== Math.floor(walkCycle / (Math.PI/2))) {
                                footstepNoise.triggerAttackRelease("32n");
                            }
                        }

                        playerLimbs.lArm.rotation.x = Math.sin(walkCycle) * 0.8;
                        playerLimbs.rArm.rotation.x = -Math.sin(walkCycle) * 0.8;
                        playerLimbs.lLeg.rotation.x = -Math.sin(walkCycle) * 0.8;
                        playerLimbs.rLeg.rotation.x = Math.sin(walkCycle) * 0.8;
                    } else {
                        // Reset animation to standing
                        walkCycle = 0;
                        playerLimbs.lArm.rotation.x = 0; playerLimbs.rArm.rotation.x = 0;
                        playerLimbs.lLeg.rotation.x = 0; playerLimbs.rLeg.rotation.x = 0;
                    }

                    // Mute vehicle sounds while walking
                    if (audioReady) {
                        engineVolume.volume.rampTo(-Infinity, 0.2);
                        windVolume.volume.rampTo(-Infinity, 0.2);
                    }

                    // Interaction Proximity Check
                    let closestCar = null;
                    let closestDist = 5.0; // Interact radius
                    
                    worldCars.forEach(carObj => {
                        const dist = playerMesh.position.distanceTo(carObj.mesh.position);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestCar = carObj;
                        }
                    });

                    state.currentInteractable = closestCar;
                    const promptUI = document.getElementById('action-prompt');
                    
                    if (closestCar) {
                        promptUI.classList.remove('hidden');
                        if (closestCar.data.owned) {
                            promptUI.innerText = `Press F (or 🟡) to Drive ${closestCar.data.name}`;
                        } else {
                            promptUI.innerText = `Press F (or 🟡) to Buy ${closestCar.data.name} (💎 ${closestCar.data.price})`;
                        }
                    } else {
                        promptUI.classList.add('hidden');
                    }

                    // Camera Follow (On Foot)
                    if (state.cameraMode === 'FIRST_PERSON') {
                        camera.position.copy(playerMesh.position);
                        camera.position.y += 1.6; // Human Eye level
                        
                        // Flawless 360-degree free look using mouse drag
                        const lookX = camera.position.x + Math.sin(orbitAngleX);
                        const lookY = camera.position.y + orbitAngleY;
                        const lookZ = camera.position.z + Math.cos(orbitAngleX);
                        camera.lookAt(lookX, lookY, lookZ);
                    } else {
                        // Third person free-cam (Removed spring back so character walks exactly where you aim)
                        const camDist = 8;
                        const camPosX = playerMesh.position.x - Math.sin(orbitAngleX) * camDist;
                        const camPosZ = playerMesh.position.z - Math.cos(orbitAngleX) * camDist;
                        const camPosY = playerMesh.position.y + 4 - orbitAngleY * camDist;

                        // Frame-independent, buttery smooth camera interpolation
                        camera.position.x += (camPosX - camera.position.x) * 0.05 * dt;
                        camera.position.z += (camPosZ - camera.position.z) * 0.05 * dt;
                        camera.position.y += (camPosY - camera.position.y) * 0.05 * dt;
                        
                        // Camera Bounds Barrier
                        const mapLimit = (config.citySize * config.blockSize) / 2 - 2;
                        camera.position.x = Math.max(-mapLimit, Math.min(mapLimit, camera.position.x));
                        camera.position.z = Math.max(-mapLimit, Math.min(mapLimit, camera.position.z));
                        camera.position.y = Math.max(0.5, camera.position.y); // Prevent going under the map

                        camera.lookAt(playerMesh.position.x, playerMesh.position.y + 1, playerMesh.position.z);
                    }
                }
                
                // === DRIVING LOGIC ===
                else if (state.playerMode === 'DRIVING' && activeWorldCar) {
                    
                    // Hide interaction prompt while driving
                    document.getElementById('action-prompt').classList.add('hidden');
                    
                    const activeCarData = activeWorldCar.data;
                    const carMesh = activeWorldCar.mesh;
                    const isBike = activeCarData.type === 'bike';
                    
                    let currentAccel = state.acceleration * (isBike ? 1.5 : 1);
                    let currentMaxSpeed = state.maxSpeed * (isBike ? 1.2 : 1);
                    
                    // Apply handling multiplier from settings menu
                    let currentHandling = state.handling * (isBike ? 1.3 : 1) * state.settings.handlingMult;

                    if (state.inputs.boost && state.nitrous > 0 && state.inputs.forward) {
                        currentAccel *= 2.5; currentMaxSpeed *= 1.5;
                        state.nitrous -= 0.5 * dt;
                        camera.fov = THREE.MathUtils.lerp(camera.fov, state.cameraMode === 'FIRST_PERSON' ? 100 : 85, 0.1); 
                    } else {
                        if (state.nitrous < 100) state.nitrous += 0.05 * dt;
                        camera.fov = THREE.MathUtils.lerp(camera.fov, state.cameraMode === 'FIRST_PERSON' ? 75 : 60, 0.1); 
                    }
                    camera.updateProjectionMatrix();

                    if (state.inputs.forward) carVelocity += currentAccel * dt;
                    if (state.inputs.backward) carVelocity -= currentAccel * dt;
                    
                    let friction = 0.002;
                    let handlingMod = 1;
                    let targetSlipAngle = 0; 
                    let steeringVisualTarget = 0;

                    if (state.inputs.brake) {
                        if (Math.abs(carVelocity) > 0.3 && (state.inputs.left || state.inputs.right)) {
                            friction = 0.005; handlingMod = 2.2; // Drift
                        } else friction = 0.02; // Hard Brake
                    }

                    if (carVelocity > 0) { carVelocity -= friction * dt; if (carVelocity < 0) carVelocity = 0; } 
                    else if (carVelocity < 0) { carVelocity += friction * dt; if (carVelocity > 0) carVelocity = 0; }

                    if (carVelocity > currentMaxSpeed) carVelocity = currentMaxSpeed;
                    if (carVelocity < -currentMaxSpeed/2) carVelocity = -currentMaxSpeed/2;

                    if (Math.abs(carVelocity) > 0.01) {
                        const direction = carVelocity > 0 ? 1 : -1;
                        if (state.inputs.left) {
                            carAngle += currentHandling * handlingMod * direction * dt;
                            if (friction === 0.005) targetSlipAngle = 0.45;
                            steeringVisualTarget = Math.PI / 4;
                        }
                        if (state.inputs.right) {
                            carAngle -= currentHandling * handlingMod * direction * dt;
                            if (friction === 0.005) targetSlipAngle = -0.45;
                            steeringVisualTarget = -Math.PI / 4;
                        }
                    }
                    
                    // Smooth drift slip angle interpolation (Removes snappy/clingy drifts)
                    if (typeof carMesh.userData.slipAngle === 'undefined') carMesh.userData.slipAngle = 0;
                    carMesh.userData.slipAngle = THREE.MathUtils.lerp(carMesh.userData.slipAngle, targetSlipAngle, 0.1 * dt);

                    if (carMesh.userData.steeringWheel) {
                        const wheel = carMesh.userData.steeringWheel;
                        if (isBike) wheel.rotation.y = THREE.MathUtils.lerp(wheel.rotation.y, steeringVisualTarget, 0.1 * dt);
                        else wheel.rotation.z = THREE.MathUtils.lerp(wheel.rotation.z, steeringVisualTarget, 0.1 * dt);
                    }

                    const nextX = carMesh.position.x + Math.sin(carAngle) * carVelocity * dt;
                    const nextZ = carMesh.position.z + Math.cos(carAngle) * carVelocity * dt;

                    if (checkCollision(nextX, nextZ, 1.0)) {
                        carVelocity *= -0.4;
                        state.nitrous = Math.max(0, state.nitrous - 10);
                    } else {
                        carMesh.position.x = nextX;
                        carMesh.position.z = nextZ;
                    }

                    // Apply the smoothly interpolated drift angle
                    carMesh.rotation.y = carAngle + carMesh.userData.slipAngle;
                    
                    if (isBike) {
                        const targetTilt = (state.inputs.left ? -0.3 : (state.inputs.right ? 0.3 : 0)) * (carVelocity / currentMaxSpeed);
                        carMesh.rotation.z = THREE.MathUtils.lerp(carMesh.rotation.z, targetTilt, 0.1 * dt);
                    }

                    // Animate Wheels physically spinning
                    if (carMesh.userData.wheels) {
                        carMesh.userData.wheels.forEach(w => w.rotation.x += carVelocity * dt * 0.2);
                    }

                    // --- VEHICLE AUDIO ---
                    if (audioReady) {
                        const speedRatio = Math.abs(carVelocity) / currentMaxSpeed;
                        engineVolume.volume.rampTo(-8, 0.1);
                        
                        // Dynamic Layered Engine Pitch
                        let targetPitch = isBike ? 80 + speedRatio * 250 : 50 + speedRatio * 150;
                        if (state.inputs.boost && state.nitrous > 0 && state.inputs.forward) targetPitch *= 1.5;
                        
                        engineNoise.frequency.rampTo(targetPitch, 0.1);
                        engineSub.frequency.rampTo(targetPitch / 2, 0.1); // Throatier sub layer
                        
                        engineFilter.frequency.rampTo(300 + speedRatio * 3500, 0.1);

                        // Dynamic Wind & Tire Screech
                        if (friction === 0.005 && Math.abs(carVelocity) > 0.3) {
                            windVolume.volume.rampTo(-5, 0.1); // Tire screech/skid
                            windFilter.frequency.rampTo(1200, 0.1);
                        } else if (speedRatio > 0.2) {
                            windVolume.volume.rampTo(-15 + speedRatio * 10, 0.2); // Wind rushing
                            windFilter.frequency.rampTo(400 + speedRatio * 800, 0.2);
                        } else {
                            windVolume.volume.rampTo(-Infinity, 0.2); // Quiet when stopped
                        }
                    }

                    // CAMERA LOGIC
                    if (state.cameraMode === 'FIRST_PERSON') {
                        // Positioned perfectly behind the steering wheel (x: 0.4) and aligned to eye level
                        const camOffset = new THREE.Vector3(isBike ? 0 : 0.4, isBike ? 1.4 : 1.15, isBike ? 0.3 : 0.4);
                        camOffset.applyEuler(carMesh.rotation);
                        camera.position.copy(carMesh.position).add(camOffset);
                        
                        // Smooth free-look around the interior (uncoupled from steering jerks)
                        const lookOffset = new THREE.Vector3(
                            Math.sin(orbitAngleX) * 10, 
                            orbitAngleY * 10, 
                            Math.cos(orbitAngleX) * 10
                        );
                        lookOffset.applyEuler(carMesh.rotation);
                        camera.lookAt(camera.position.clone().add(lookOffset));
                    } else {
                        // Driving Third Person with Free-Cam Orbit
                        // Only spring back behind car if we are actively driving (allows free look while parked)
                        if (!isDraggingCam && Math.abs(carVelocity) > 0.05) { 
                            orbitAngleX *= 0.92; 
                            orbitAngleY *= 0.92; 
                        } 

                        const cameraOffsetDist = 12 + Math.abs(carVelocity) * 5;
                        const totalAngle = carAngle + orbitAngleX;
                        
                        // Camera now safely trails behind the vehicle
                        const targetCamX = carMesh.position.x - Math.sin(totalAngle) * cameraOffsetDist;
                        const targetCamZ = carMesh.position.z - Math.cos(totalAngle) * cameraOffsetDist;
                        const targetCamY = (isBike ? 5 : 6) - orbitAngleY * cameraOffsetDist;

                        // Ultra-smooth, cinematic frame-independent camera follow (feels weighty)
                        camera.position.x += (targetCamX - camera.position.x) * 0.06 * dt;
                        camera.position.z += (targetCamZ - camera.position.z) * 0.06 * dt;
                        camera.position.y += (targetCamY - camera.position.y) * 0.06 * dt;
                        
                        // Camera Bounds Barrier
                        const mapLimit = (config.citySize * config.blockSize) / 2 - 2;
                        camera.position.x = Math.max(-mapLimit, Math.min(mapLimit, camera.position.x));
                        camera.position.z = Math.max(-mapLimit, Math.min(mapLimit, camera.position.z));
                        camera.position.y = Math.max(0.5, camera.position.y); // Prevent going under the map

                        camera.lookAt(carMesh.position);
                    }

                    state.distance += Math.abs(carVelocity) * dt * 0.02;
                    if (Math.abs(carVelocity) > 0.2) { addExperience(0.1 * dt); state.currency += 0.05 * dt; }
                } // End DRIVING mode

                if (Math.random() < 0.1) updateHUD();
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize!
        buildCity();
        setupWorld();
        updateHUD();
        animate();
        
        // (Welcome Toast moved into Boot Screen logic)
    </script>
</body>
</html>
